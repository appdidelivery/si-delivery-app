name: Linvix Integration Tests

on:
  pull_request:
    paths:
      - 'lib/linvix.js'
      - 'lib/linvix-orders.js'
      - 'tests/linvix-*.test.mjs'
      - 'package.json'
      - '.github/workflows/linvix-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/linvix.js'
      - 'lib/linvix-orders.js'
      - 'tests/linvix-*.test.mjs'
      - 'package.json'
      - '.github/workflows/linvix-tests.yml'

permissions:
  contents: read

jobs:
  linvix-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node version
        run: node --version
      - name: Teste sem credenciais externas
        run: node --test tests/linvix-stock.test.mjs tests/linvix-orders.test.mjs
