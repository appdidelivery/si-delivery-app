name: WhatsApp journey safety
on:
  pull_request:
    paths:
      - 'api/index.js'
      - 'lib/whatsappReplyRecipient.js'
      - 'tests/whatsappReplyRecipient.test.mjs'
      - 'api/whatsapp-audience.js'
      - 'server/journeyQueue.js'
      - 'server/lifecycleDispatch.js'
      - 'server/footballRadar.js'
      - 'server/footballAlerts.js'
      - 'lib/footballFixtures.js'
      - 'lib/csiOccasionTemplate.js'
      - 'lib/whatsappLeadAudience.js'
      - 'lib/whatsappConsentCapture.js'
      - 'tests/whatsappConsentCapture.test.js'
      - 'tests/whatsappMarketingGraph.test.mjs'
      - 'lib/whatsappMarketingGraph.js'
      - 'lib/csiMarketingEligibility.js'
      - 'lib/csiMarketingReadiness.js'
      - 'tests/csiMarketingReadiness.test.mjs'
      - 'tests/csiConsentButtons.test.mjs'
      - 'lib/csiMarketingConsentInvite.js'
      - 'lib/csiConsentReceiptSummary.js'
      - 'tests/csiConsentReceiptSummary.test.mjs'
      - 'tests/csiWabaLink.test.mjs tests/whatsappReplyRecipient.test.mjs'
      - 'src/pages/MarketingAutomationStatus.jsx'
      - 'tests/whatsappLeadAudience.test.js'
      - 'tests/csiOccasionTemplate.test.js'
      - 'tests/footballFixtures.test.js'
      - 'lib/lifecycleSchedule.js'
      - 'vercel.json'
      - 'lib/whatsappMarketingGuard.js'
      - 'lib/marketingBatchSelection.js'
      - 'tests/marketingBatchSelection.test.js'
      - 'src/pages/WppWebview.jsx'
      - 'src/components/AdminChat.jsx'
      - 'tests/whatsappMarketingGuard.test.js'
      - 'tests/lifecycleSchedule.test.js'
      - '.github/workflows/whatsapp-journey-safety.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Syntax checks
        run: |
          node --check api/index.js
          node --check api/whatsapp-audience.js
          node --check server/journeyQueue.js
          node --check lib/whatsappMarketingGraph.js
          node --check lib/whatsappReplyRecipient.js
          node --check lib/csiMarketingEligibility.js
          node --check lib/csiMarketingReadiness.js
          node --check lib/csiMarketingConsentInvite.js
          node --check lib/csiConsentReceiptSummary.js
          node --check lib/whatsappMarketingGuard.js
          node --check lib/marketingBatchSelection.js
          node --check lib/lifecycleSchedule.js
          node --check server/lifecycleDispatch.js
          node --check server/footballRadar.js
          node --check server/footballAlerts.js
          node --check lib/footballFixtures.js
          node --check lib/csiOccasionTemplate.js
          node --check lib/whatsappLeadAudience.js
          node --check lib/whatsappConsentCapture.js
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
      - name: Marketing opt-in and quota tests
        run: node --test tests/whatsappMarketingGuard.test.js tests/lifecycleSchedule.test.js tests/footballFixtures.test.js tests/csiOccasionTemplate.test.js tests/whatsappLeadAudience.test.js tests/whatsappConsentCapture.test.js tests/whatsappMarketingGraph.test.mjs tests/csiMarketingReadiness.test.mjs tests/csiConsentButtons.test.mjs tests/csiConsentReceiptSummary.test.mjs tests/csiWabaLink.test.mjs
