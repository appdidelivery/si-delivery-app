name: PDV — Caixa por operador

on:
  pull_request:
    paths:
      - 'src/utils/cashRegisterState.js'
      - 'src/pages/AdminLegacy.jsx'
      - 'tests/cash-register-state.test.mjs'
      - '.github/workflows/cash-register-tests.yml'
  push:
    branches:
      - 'fix/csi-caixa-por-operador-20261009'
    paths:
      - 'src/utils/cashRegisterState.js'
      - 'src/pages/AdminLegacy.jsx'
      - 'tests/cash-register-state.test.mjs'
      - '.github/workflows/cash-register-tests.yml'

jobs:
  cash-register-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar sessão exclusiva do atendente e da loja
        run: node --test tests/cash-register-state.test.mjs
