name: CSI receipt and catalog safety
on:
  pull_request:
    paths:
      - 'src/components/AdminChat.jsx'
      - 'src/pages/AdminLegacy.jsx'
      - 'src/lib/chatProductShare.js'
      - 'src/lib/orderReceiptAudit.js'
      - 'tests/chatProductShare.test.mjs'
      - 'tests/orderReceiptAudit.test.mjs'
      - '.github/workflows/csi-receipt-catalog.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check helpers syntax
        run: |
          node --check src/lib/chatProductShare.js
          node --check src/lib/orderReceiptAudit.js
      - name: Receipt and catalog regression tests
        run: node --test tests/orderReceiptAudit.test.mjs tests/chatProductShare.test.mjs
